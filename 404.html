<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | TempChats</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Material Symbols Rounded -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,100..700,0..1,-50..200" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f1221;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      overflow-x: hidden;
    }
    .container {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s cubic-bezier(0.2, 0, 0, 1);
    }
    .icon-wrapper {
      margin-bottom: 1.5rem;
      color: #818cf8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
    }
    .material-symbols-rounded {
      font-size: 80px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #818cf8;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 20px rgba(129, 140, 248, 0.25);
    }
    .title {
      font-size: 1.875rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
      max-width: 400px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #6366f1;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-home:hover {
      background-color: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }
    .btn-home:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @media (max-width: 480px) {
      .error-code {
        font-size: 4.5rem;
      }
      .title {
        font-size: 1.5rem;
      }
      .material-symbols-rounded {
        font-size: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper" aria-hidden="true">
      <span class="material-symbols-rounded">explore_off</span>
    </div>
    <h1 class="error-code">404</h1>
    <h2 class="title">Page not found</h2>
    <p class="description">
      The room or page you are looking for doesn't exist, may have expired, or has been permanently auto-destructed.
    </p>
    <a href="/" class="btn-home">
      <span class="material-symbols-rounded" style="font-size: 20px;">home</span>
      Go Home
    </a>
  </div>
</body>
</html>
